name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint, contract check, and unit tests
        run: npm test

      - name: Production build
        run: npm run build

  python:
    name: Python (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      # Media-independent suite only. tests/test_offline_pipeline.py needs recorded
      # fixtures that are deliberately not published; see tests/fixtures/README.md.
      - name: Unit tests
        run: |
          python -m unittest -v \
            tests.test_ai_provider_contract \
            tests.test_perspective_compositor \
            tests.test_portal_crossing \
            tests.test_stabilized_tracker \
            tests.test_tracker

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on committed Gemini API keys
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{20,}' -- . ; then
            echo "::error::A Google API key pattern is committed in the repository"
            exit 1
          fi
          echo "No committed API key patterns found"
